mongo:
  uri: "mongodb://mongo-service.gms:27017/mianshizuoye"
  dbname: "mianshizuoye"

new_api:
  url: "" # e.g. https://api.example.com/v1/extract
  api_key: "" # keep empty unless configured
  timeout: 15
  retries: 2

crawler:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0 Safari/537.36"
  request_interval_seconds: 1
  max_retries: 2
  output_dir: "./output"

fields:
  - name: "商品价格"
    description: "网页中展示的商品实际售价，不含运费、优惠券等附加费用"
    type_hint: "price"
  - name: "上市时间"
    description: "产品首次上市日期"
    type_hint: "date"
