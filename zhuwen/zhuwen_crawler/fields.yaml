# 字段提取规则配置 - 定义主字段和子字段

# 主字段列表
main_fields:
  - id: "title"
    name: "标题"
    description: "网页的主标题，通常是页面最显著的标题文字"
    # 子字段列表（可选）
    sub_fields:
      - id: "main_title"
        name: "主标题"
        description: "页面的主要标题文字，不含副标题"
      - id: "sub_title"
        name: "副标题"
        description: "如果有副标题，提取副标题内容"

  - id: "content_summary"
    name: "内容摘要"
    description: "页面正文内容的摘要或简介部分"
    sub_fields: []

  - id: "author"
    name: "作者/来源"
    description: "内容的作者、发布者或来源信息"
    sub_fields: []

  - id: "publish_time"
    name: "发布时间"
    description: "内容的发布日期或更新日期"
    sub_fields: []

  - id: "keywords"
    name: "关键词"
    description: "页面涉及的关键词或标签"
    sub_fields: []

