# 提取规则说明：
# - id: 字段唯一标识符，用于数据库存储和查询
# - name: 字段显示名称，用于界面展示
# - description: 字段语义描述，用于AI理解提取意图
# - sub_fields: 子字段列表，用于复杂字段的细分提取