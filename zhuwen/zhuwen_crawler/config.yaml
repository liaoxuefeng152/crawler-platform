# 爬虫配置文件 - 所有URL和参数均可配置

# 目标网址列表（可配置多个）
urls:
  - "https://example.com/"  # 示例网站（稳定不反爬）
  # - "https://baike.baidu.com/item/Python/405313"  # 百度百科（可能被反爬）

# 爬虫策略配置
crawler:
  # 请求头配置（模拟浏览器）
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
    Accept-Encoding: "gzip, deflate, br"
    Connection: "keep-alive"

  # 反爬策略
  rate_limit_delay: 1.0  # 请求间隔（秒）
  timeout: 30  # 请求超时（秒）
  max_retries: 3  # 最大重试次数

  # 内容提取策略
  main_content_selectors:
    - "article"
    - ".article-content"
    - ".post-content"
    - ".content"
    - ".main-content"
    - "#content"
    - "#main"
    - "main"

  # 需要移除的元素（广告、导航等）
  remove_selectors:
    - "script"
    - "style"
    - "iframe"
    - "noscript"
    - "nav"
    - ".nav"
    - ".menu"
    - ".sidebar"
    - ".footer"
    - ".header-nav"
    - ".comments"
    - "[class*='ad']"
    - "[class*='advertisement']"
    - "[id*='ad']"
    - "[class*='banner']"
    - "[class*='promo']"

# MD转换配置
markdown:
  heading_style: "atx"  # 使用 # 标题格式
  code_block_style: "fenced"  # 使用 ``` 代码块
  bullet_list_marker: "-"  # 列表使用 - 符号
  strip_newlines: false  # 是否去除换行

  # 是否添加元信息头部
  add_metadata_header: true
  metadata_template: |
    # 爬取内容

    > 来源: {domain}
    > 爬取时间: {timestamp}
    > 原始URL: {url}

    ---

# 存储配置
storage:
  # MD文件存储路径
  md_storage_path: "./storage/md"

  # MongoDB配置
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "crawler_db"
    collections:
      crawl_tasks: "crawl_tasks"
      main_fields: "main_fields"
      sub_fields: "sub_fields"

# AI提取配置（可选）
ai_extraction:
  enabled: false  # 是否启用AI提取
  api_endpoint: ""  # API地址
  api_key: ""  # API密钥（建议使用环境变量）
  model: "gpt-oss-120b"  # 模型名称
  timeout: 60  # 超时时间（秒）
  retry_count: 3  # 重试次数